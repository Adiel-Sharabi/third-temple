<script>
/* the theme before first paint: a saved choice, else the system's colour scheme */
(function(){
  var t = null;
  try { t = localStorage.getItem("mikdash-theme"); } catch (e) {}
  if (t !== "night" && t !== "drawing" && t !== "gallery")
    t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "gallery";
  document.documentElement.setAttribute("data-theme", t);
})();
</script>

</main>

<aside class="methods drawer" id="methods" aria-labelledby="methods-title">
